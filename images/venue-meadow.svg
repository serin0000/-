<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="meadow-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050b18"/>
      <stop offset="60%" stop-color="#0a1d37"/>
      <stop offset="100%" stop-color="#122a22"/>
    </linearGradient>
    <linearGradient id="grass-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#081c15"/>
    </linearGradient>
    <radialGradient id="screen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#90e0ef" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="400" fill="url(#meadow-sky)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="60" cy="50" r="1.5"/><circle cx="120" cy="30" r="1"/><circle cx="210" cy="70" r="1.8"/>
    <circle cx="340" cy="40" r="1.2"/><circle cx="450" cy="80" r="2"/><circle cx="530" cy="35" r="1"/>
    <circle cx="570" cy="95" r="1.5"/><circle cx="180" cy="110" r="1"/><circle cx="390" cy="100" r="1.2"/>
  </g>

  <!-- Pine Trees Background -->
  <path d="M 0 250 L 30 180 L 60 250 L 80 190 L 110 260 L 480 260 L 510 170 L 540 255 L 570 185 L 600 260 L 600 400 L 0 400 Z" fill="#081d18"/>

  <!-- Grass Hill Foreground -->
  <path d="M 0 240 Q 300 210, 600 245 L 600 400 L 0 400 Z" fill="url(#grass-grad)"/>

  <!-- Giant Outdoor Screen -->
  <g transform="translate(180, 80)">
    <!-- Screen Frame Structure -->
    <rect x="0" y="0" width="240" height="135" rx="6" fill="#02050a" stroke="#f6c453" stroke-width="2"/>
    <!-- Projected Screen -->
    <rect x="6" y="6" width="228" height="123" rx="4" fill="#0f2b48"/>
    <!-- Glow Beam -->
    <ellipse cx="120" cy="67" rx="100" ry="50" fill="url(#screen-glow)"/>
    <!-- Movie Image hint: Night stars in movie -->
    <circle cx="120" cy="60" r="25" fill="#f8fafc" opacity="0.85"/>
    <path d="M 30 129 L 210 129 L 190 100 L 50 100 Z" fill="#071b2f"/>
    <!-- Support Truss Legs -->
    <line x1="20" y1="135" x2="10" y2="180" stroke="#475569" stroke-width="4"/>
    <line x1="220" y1="135" x2="230" y2="180" stroke="#475569" stroke-width="4"/>
    <line x1="120" y1="135" x2="120" y2="180" stroke="#475569" stroke-width="4"/>
  </g>

  <!-- Picnic Blankets & Cushions -->
  <g transform="translate(70, 275)">
    <!-- Blanket 1 -->
    <polygon points="0,35 60,15 110,40 50,65" fill="#e76f51" opacity="0.85"/>
    <circle cx="45" cy="40" r="9" fill="#f4a261"/>
    <!-- Fairy Lantern -->
    <circle cx="70" cy="30" r="5" fill="#ffd166"/>
    <circle cx="70" cy="30" r="14" fill="#ffd166" opacity="0.3"/>
  </g>

  <g transform="translate(250, 290)">
    <!-- Blanket 2 Center -->
    <polygon points="0,30 90,10 160,35 70,60" fill="#2a9d8f" opacity="0.85"/>
    <!-- Cushions / Bean bags -->
    <ellipse cx="45" cy="35" rx="14" ry="10" fill="#f4a261"/>
    <ellipse cx="105" cy="30" rx="15" ry="11" fill="#e9c46a"/>
    <!-- Popcorn box & Wine glasses -->
    <polygon points="75,26 83,26 81,40 77,40" fill="#ff4d6d"/>
  </g>

  <g transform="translate(440, 280)">
    <!-- Blanket 3 -->
    <polygon points="0,25 70,10 120,35 50,55" fill="#e9c46a" opacity="0.85"/>
    <ellipse cx="60" cy="30" rx="16" ry="11" fill="#264653"/>
    <!-- Fairy light string along edge -->
    <path d="M -30 20 Q 40 45, 110 30" stroke="#ffeaa7" stroke-width="1.5" stroke-dasharray="3,8" fill="none"/>
  </g>

  <!-- Fairy lights hanging between trees -->
  <path d="M 0 160 Q 90 200, 180 160" stroke="#ffeaa7" stroke-width="1.5" stroke-dasharray="4,12" fill="none"/>
  <path d="M 420 160 Q 510 200, 600 160" stroke="#ffeaa7" stroke-width="1.5" stroke-dasharray="4,12" fill="none"/>
</svg>

