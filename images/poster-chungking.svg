<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="neon-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#041212"/>
      <stop offset="40%" stop-color="#092823"/>
      <stop offset="75%" stop-color="#1e182e"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="560" fill="url(#neon-night)"/>

  <!-- Vertical Neon Signs & Light Streaks -->
  <g opacity="0.45">
    <rect x="50" y="40" width="18" height="180" rx="4" fill="#00e5ff" filter="url(#neon-glow)"/>
    <rect x="85" y="80" width="14" height="120" rx="3" fill="#ff007f" filter="url(#neon-glow)"/>
    <rect x="310" y="50" width="22" height="210" rx="4" fill="#ffb300" filter="url(#neon-glow)"/>
    <rect x="345" y="100" width="14" height="140" rx="3" fill="#00e676" filter="url(#neon-glow)"/>
  </g>

  <!-- Film Grain / Bokeh Circles -->
  <circle cx="120" cy="140" r="35" fill="#ff3366" opacity="0.25" filter="url(#neon-glow)"/>
  <circle cx="270" cy="160" r="45" fill="#00e5ff" opacity="0.2" filter="url(#neon-glow)"/>
  <circle cx="190" cy="90" r="25" fill="#ffb300" opacity="0.3" filter="url(#neon-glow)"/>

  <!-- Iconic Silhouette: Blond Wig, Trenchcoat, Sunglasses & Pineapple Can -->
  <g transform="translate(145, 170)">
    <!-- Blond Wig Shape -->
    <path d="M 30 25 Q 55 5, 80 25 Q 95 65, 85 90 Q 60 75, 45 90 Q 25 70, 30 25 Z" fill="#ffd54f" opacity="0.9"/>
    <!-- Sunglasses -->
    <rect x="38" y="52" width="15" height="10" rx="3" fill="#05070a"/>
    <rect x="57" y="52" width="15" height="10" rx="3" fill="#05070a"/>
    <line x1="53" y1="56" x2="57" y2="56" stroke="#05070a" stroke-width="2"/>
    <!-- Face Silhouette -->
    <path d="M 40 45 Q 55 35, 70 45 L 70 75 Q 55 90, 40 75 Z" fill="#ffccbc" opacity="0.7"/>
    <!-- Trenchcoat -->
    <path d="M 20 85 L 90 85 L 105 210 L 5 210 Z" fill="#2d2b38"/>
    <!-- Trench collar -->
    <polygon points="35,85 55,120 40,120" fill="#1b1924"/>
    <polygon points="75,85 55,120 70,120" fill="#1b1924"/>
    <!-- Pineapple Can Motif (Can of Expiration Date: 1994-05-01) -->
    <g transform="translate(35, 140) scale(0.8)">
      <rect x="0" y="10" width="45" height="40" rx="4" fill="#f59e0b"/>
      <ellipse cx="22.5" cy="10" rx="22.5" ry="5" fill="#fbbf24"/>
      <ellipse cx="22.5" cy="50" rx="22.5" ry="5" fill="#d97706"/>
      <text x="22.5" y="32" font-family="'Noto Sans TC', sans-serif" font-size="8" font-weight="700" fill="#1e1b4b" text-anchor="middle">MAY 1</text>
    </g>
  </g>

  <!-- Title & Credits -->
  <rect x="0" y="415" width="400" height="145" fill="#070a12ee"/>
  <text x="200" y="450" font-family="'Cinzel', 'Playfair Display', serif" font-size="26" font-weight="800" fill="#f8fafc" letter-spacing="4" text-anchor="middle">CHUNGKING EXPRESS</text>
  <text x="200" y="480" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="600" fill="#f6c453" letter-spacing="6" text-anchor="middle">重慶森林 ｜ 迷幻午夜</text>
  <text x="200" y="508" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#cbd5e1" letter-spacing="2" text-anchor="middle">王家衛 經典巨作 ・ 鳳梨罐頭會過期，記憶不會</text>
  <line x1="80" y1="522" x2="320" y2="522" stroke="#f6c453" stroke-width="0.8" opacity="0.5"/>
</svg>

