<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="pic-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1720"/>
      <stop offset="100%" stop-color="#142c26"/>
    </linearGradient>
  </defs>

  <rect width="500" height="350" rx="16" fill="url(#pic-bg)"/>

  <!-- Grass Ground & Ambient Starlight -->
  <path d="M 0 220 Q 250 190, 500 220 L 500 350 L 0 350 Z" fill="#082017"/>

  <!-- Bohemian Picnic Blanket -->
  <g transform="translate(60, 180)">
    <!-- Base rug with fringe -->
    <polygon points="40,30 340,10 400,90 80,120" fill="#fdf0d5"/>
    <polygon points="50,38 330,20 385,85 90,110" fill="#c1121f" opacity="0.8"/>
    <!-- Bohemian Pattern Diamond Stripes -->
    <polygon points="90,45 130,42 150,75 110,80" fill="#fdf0d5" opacity="0.6"/>
    <polygon points="170,40 210,38 230,70 190,75" fill="#fdf0d5" opacity="0.6"/>
    <polygon points="250,35 290,32 310,65 270,70" fill="#fdf0d5" opacity="0.6"/>
  </g>

  <!-- Inflatable Air Lounger Sofa (Warm Amber/Terracotta) -->
  <g transform="translate(190, 120)">
    <!-- Main sofa body -->
    <ellipse cx="90" cy="65" rx="85" ry="38" fill="#f4a261"/>
    <ellipse cx="65" cy="55" rx="55" ry="25" fill="#e76f51"/>
    <!-- Indentation for sitting -->
    <path d="M 40 55 Q 90 70, 140 55" stroke="#9d0208" stroke-width="3" fill="none"/>
  </g>

  <!-- Cushions / Pillows -->
  <ellipse cx="140" cy="205" rx="26" ry="18" fill="#2a9d8f"/>
  <ellipse cx="360" cy="195" rx="24" ry="16" fill="#e9c46a"/>

  <!-- Wooden Camping Crate Table -->
  <g transform="translate(230, 210)">
    <rect x="0" y="0" width="85" height="50" rx="4" fill="#582f0e" stroke="#371d09" stroke-width="2"/>
    <line x1="0" y1="17" x2="85" y2="17" stroke="#371d09" stroke-width="1.5"/>
    <line x1="0" y1="34" x2="85" y2="34" stroke="#371d09" stroke-width="1.5"/>
    <!-- Warm Lantern on table -->
    <circle cx="42" cy="-6" r="14" fill="#ffb703" opacity="0.5"/>
    <circle cx="42" cy="-6" r="5" fill="#ffffff"/>
    <rect x="36" y="-14" width="12" height="18" rx="3" fill="none" stroke="#d4a373" stroke-width="1.5"/>
  </g>

  <!-- Hanging Star Lights -->
  <g fill="#ffe66d">
    <polygon points="80,45 83,53 91,54 85,60 87,68 80,63 73,68 75,60 69,54 77,53"/>
    <polygon points="410,55 413,63 421,64 415,70 417,78 410,73 403,78 405,70 399,64 407,63"/>
    <polygon points="250,30 252,36 258,37 253,42 255,48 250,44 245,48 247,42 242,37 248,36"/>
  </g>
</svg>

