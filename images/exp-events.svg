<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="evt-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#150a24"/>
      <stop offset="50%" stop-color="#2d0b38"/>
      <stop offset="100%" stop-color="#0e0417"/>
    </linearGradient>
    <radialGradient id="sparkle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f72585" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="350" rx="16" fill="url(#evt-bg)"/>

  <!-- Sparkling Festive Backdrop -->
  <circle cx="250" cy="160" r="130" fill="url(#sparkle-glow)" opacity="0.6"/>

  <!-- Movie Clapperboard (Classic Cinema Event Icon) -->
  <g transform="translate(160, 90)">
    <!-- Clapper Board Base -->
    <rect x="0" y="45" width="180" height="135" rx="8" fill="#111827" stroke="#f6c453" stroke-width="2"/>
    <!-- Clapper Top bar (open angle) -->
    <g transform="rotate(-18 0 45)">
      <rect x="0" y="10" width="185" height="32" rx="4" fill="#111827" stroke="#f6c453" stroke-width="2"/>
      <!-- Diagonal Slanted Stripes -->
      <polygon points="25,12 45,12 35,40 15,40" fill="#f8fafc"/>
      <polygon points="65,12 85,12 75,40 55,40" fill="#f8fafc"/>
      <polygon points="105,12 125,12 115,40 95,40" fill="#f8fafc"/>
      <polygon points="145,12 165,12 155,40 135,40" fill="#f8fafc"/>
    </g>

    <!-- Clapper Lower bar stripes -->
    <polygon points="25,47 45,47 35,72 15,72" fill="#f8fafc"/>
    <polygon points="65,47 85,47 75,72 55,72" fill="#f8fafc"/>
    <polygon points="105,47 125,47 115,72 95,72" fill="#f8fafc"/>
    <polygon points="145,47 165,47 155,72 135,72" fill="#f8fafc"/>

    <!-- Clapper text -->
    <text x="25" y="105" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#f6c453">STARLIGHT FESTIVAL</text>
    <text x="25" y="130" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#cbd5e1">SCENE: 01 ｜ TAKE: VIP</text>
    <text x="25" y="155" font-family="'Noto Sans TC', sans-serif" font-size="9" fill="#94a3b8">DATE: UNDER THE STARS</text>

    <!-- Golden Laurel Star -->
    <circle cx="145" cy="130" r="18" fill="#f6c453" opacity="0.2"/>
    <polygon points="145,118 148,126 156,127 150,133 152,141 145,136 138,141 140,133 134,127 142,126" fill="#f6c453"/>
  </g>

  <!-- Glowing Candles & Party Lights around -->
  <g transform="translate(60, 240)">
    <rect x="15" y="20" width="16" height="45" rx="3" fill="#fdf0d5"/>
    <ellipse cx="23" cy="12" rx="4" ry="8" fill="#f59e0b"/>
    <ellipse cx="23" cy="10" rx="2" ry="4" fill="#ffffff"/>
    <circle cx="23" cy="12" r="16" fill="#f59e0b" opacity="0.3"/>
  </g>

  <g transform="translate(390, 230)">
    <rect x="15" y="10" width="16" height="55" rx="3" fill="#fdf0d5"/>
    <ellipse cx="23" cy="2" rx="4" ry="8" fill="#f59e0b"/>
    <ellipse cx="23" cy="0" rx="2" ry="4" fill="#ffffff"/>
    <circle cx="23" cy="2" r="16" fill="#f59e0b" opacity="0.3"/>
  </g>

  <!-- Star Twinkles & Confetti Shimmer -->
  <polygon points="80,70 82,76 88,77 83,82 85,88 80,84 75,88 77,82 72,77 78,76" fill="#ffd166"/>
  <polygon points="410,75 412,81 418,82 413,87 415,93 410,89 405,93 407,87 402,82 408,81" fill="#ffd166"/>
  <circle cx="370" cy="50" r="2" fill="#ffffff"/>
  <circle cx="110" cy="130" r="1.5" fill="#f72585"/>
  <circle cx="430" cy="160" r="2" fill="#4cc9f0"/>
</svg>

