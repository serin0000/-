<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="gast-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140a1b"/>
      <stop offset="100%" stop-color="#2a1236"/>
    </linearGradient>
    <radialGradient id="cocktail-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="350" rx="16" fill="url(#gast-bg)"/>

  <!-- Cinema Popcorn Tub (Classic striped tub overflowing with golden buttery popcorn) -->
  <g transform="translate(100, 100)">
    <!-- Overflowing Popcorn Kernels (Fluffy golden circles) -->
    <g fill="#ffe066" stroke="#f4a261" stroke-width="1.5">
      <circle cx="45" cy="18" r="14"/><circle cx="70" cy="12" r="16"/><circle cx="95" cy="16" r="15"/>
      <circle cx="30" cy="30" r="13"/><circle cx="55" cy="28" r="15"/><circle cx="80" cy="26" r="16"/><circle cx="110" cy="28" r="14"/>
      <circle cx="40" cy="42" r="14"/><circle cx="68" cy="40" r="15"/><circle cx="98" cy="42" r="13"/>
    </g>

    <!-- Popcorn Tub Trapezoid -->
    <polygon points="20,50 120,50 105,190 35,190" fill="#f8fafc"/>
    <!-- Red Stripes -->
    <polygon points="35,50 50,50 45,190 35,190" fill="#e63946"/>
    <polygon points="65,50 80,50 72,190 62,190" fill="#e63946"/>
    <polygon points="95,50 110,50 98,190 88,190" fill="#e63946"/>

    <!-- Emblem Badge -->
    <circle cx="70" cy="115" r="22" fill="#0b0f19" stroke="#f6c453" stroke-width="2"/>
    <polygon points="70,103 73,110 81,111 75,117 77,125 70,120 63,125 65,117 59,111 67,110" fill="#f6c453"/>
  </g>

  <!-- Starlight Craft Beer Bottle & Glass / Cocktail -->
  <g transform="translate(280, 110)">
    <!-- Wine / Cocktail Glass with starlight drink -->
    <path d="M 120 50 L 160 50 L 140 100 L 140 160 L 120 160 M 140 160 L 160 160" fill="none" stroke="#f8fafc" stroke-width="2.5"/>
    <polygon points="124,56 156,56 140,94" fill="#a855f7" opacity="0.85"/>
    <!-- Star garnish on rim -->
    <circle cx="158" cy="54" r="5" fill="#fde047"/>

    <!-- Amber Craft Beer Bottle -->
    <g transform="translate(30, 20)">
      <rect x="15" y="0" width="14" height="25" fill="#78350f" stroke="#f6c453" stroke-width="1.5"/>
      <polygon points="15,25 29,25 40,55 4,55" fill="#78350f"/>
      <rect x="4" y="55" width="36" height="85" rx="5" fill="#78350f" stroke="#f6c453" stroke-width="1.5"/>
      <!-- Label -->
      <rect x="8" y="75" width="28" height="45" rx="3" fill="#0f172a"/>
      <circle cx="22" cy="98" r="8" fill="#f59e0b"/>
      <!-- Bottle cap -->
      <rect x="13" y="-5" width="18" height="5" rx="2" fill="#f6c453"/>
    </g>
  </g>

  <!-- Ambient Glow & floating spices/cinemas snacks -->
  <circle cx="340" cy="180" r="80" fill="url(#cocktail-glow)" opacity="0.4"/>
  <circle cx="250" cy="70" r="2" fill="#ffffff"/>
  <circle cx="390" cy="80" r="1.5" fill="#ffd166"/>
  <circle cx="90" cy="60" r="1.8" fill="#fde047"/>
</svg>

